name: Build Windows .exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install -r requirements.txt

      - name: Build executable
        run: >
          pyinstaller --onefile --windowed --name SaisieComptable
          --add-data "plan_comptable.json;."
          --add-data "etats_financiers_template.xlsx;."
          --hidden-import openpyxl
          --hidden-import openpyxl.cell._writer
          main.py

      - name: Upload .exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaisieComptable-windows
          path: dist/SaisieComptable.exe

      - name: Attach .exe to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SaisieComptable.exe
